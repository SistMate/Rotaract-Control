<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        Porcentaje de Asistencia - Socios
    </title>

    <!-- FONT AWESOME -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- CSS -->

    <link
        rel="stylesheet"
        href="css/porcentajes.css">

</head>

<body>

    <div class="contenedor">

        <!-- =====================================
             CABECERA
             ===================================== -->

        <div class="cabecera">

            <h1>

                <i class="fa-solid fa-chart-pie"></i>

                Porcentaje de Asistencia de Socios

            </h1>

            <button
                type="button"
                class="btnVolver"
                onclick="window.location.href='dashboard.html'">

                <i class="fa-solid fa-caret-left"></i>

                Menú Principal

            </button>

        </div>


        <!-- =====================================
             TABLA
             ===================================== -->

        <div class="tabla-contenedor">

            <table>

                <thead>

                    <tr>

                        <th>

                            <i class="fa-solid fa-user"></i>

                            Socio

                        </th>

                        <th>

                            <i class="fa-solid fa-users"></i>

                            Reuniones

                        </th>

                        <th>

                            <i class="fa-solid fa-calendar-check"></i>

                            Actividades

                        </th>

                        <th>

                            <i class="fa-solid fa-chart-line"></i>

                            Porcentaje Total

                        </th>

                    </tr>

                </thead>

                <tbody
                    id="tablaSocios">

                    <tr>

                        <td colspan="4">

                            <i class="fa-solid fa-spinner fa-spin"></i>

                            Cargando asistencia...

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </div>


    <script
        type="module"
        src="js/porcentaje-socios.js">
    </script>

</body>

</html>
