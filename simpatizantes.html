<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        Lista de Simpatizantes
    </title>

    <!-- FONT AWESOME -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- CSS -->
    <link
        rel="stylesheet"
        href="css/socios.css">

</head>

<body>

    <div class="contenedor">

        <!-- =====================================
             CABECERA
             ===================================== -->

        <div class="cabecera">

            <h1>
                Lista de Simpatizantes
            </h1>


            <!-- MENÚ PRINCIPAL -->

            <button
                class="btnVolver"
                onclick="window.location.href='dashboard.html'">

                <i class="fa-solid fa-caret-left"></i>

                Menú Principal

            </button>


            <!-- NUEVO SIMPATIZANTE -->

            <button
                class="btnNuevo"
                onclick="window.location.href='registrar-simpatizante.html'">

                <i class="fa-solid fa-user-plus"></i>

                Nuevo Simpatizante

            </button>

        </div>


        <!-- =====================================
             TABLA
             ===================================== -->

        <table>

            <thead>

                <tr>

                    <th>
                        Nombre
                    </th>

                    <th>
                        Celular
                    </th>

                    <th>
                        Fecha Ingreso
                    </th>

                    <th>
                        Acción
                    </th>

                </tr>

            </thead>


            <tbody
                id="tablaSimpatizantes">

            </tbody>

        </table>

    </div>


    <!-- JAVASCRIPT -->

    <script
        type="module"
        src="js/simpatizantes.js">
    </script>

</body>

</html>
