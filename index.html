<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roto´s Control - Inicio de Sesión</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <div class="logo">

                <img src="img/logo.png" alt="Logo Rotaract" class="logo-img">

                <h1>ROTO'S CONTROL</h1>

                

            </div>

            <div class="form-group">

                <label for="correo">
                    Correo Electrónico
                </label>

                <input
                    type="email"
                    id="correo">

            </div>

            <div class="form-group">

                <label for="password">
                    Contraseña
                </label>

                <input
                    type="password"
                    id="password">

            </div>

            <button
                id="btnLogin"
                class="btn-login">

                INICIAR SESIÓN

            </button>

            <div class="footer">

                <p>
                    &copy; 2026 Rotaract Club Cochabamba
                </p>


            </div>

        </div>

    </div>

    <script type="module" src="js/login.js"></script>

</body>

</html>
