<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        Editar Simpatizante
    </title>

    <!-- FONT AWESOME -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- CSS -->

    <link
        rel="stylesheet"
        href="css/formularios.css">

</head>

<body>

    <div class="contenedor">

        <!-- CABECERA -->

        <div class="cabecera">

            <h1>

                <i class="fa-solid fa-user-pen"></i>

                Editar Simpatizante

            </h1>

        </div>


        <!-- FORMULARIO -->

        <form id="formEditar">

            <!-- NOMBRE -->

            <div class="grupo">

                <label for="nombre">

                    <i class="fa-solid fa-user"></i>

                    Nombre Completo

                </label>

                <input
                    type="text"
                    id="nombre"
                    placeholder="Nombre Completo"
                    required>

            </div>


            <!-- CELULAR -->

            <div class="grupo">

                <label for="celular">

                    <i class="fa-solid fa-phone"></i>

                    Celular

                </label>

                <input
                    type="number"
                    id="celular"
                    placeholder="Número de celular">

            </div>


            <!-- FECHA -->

            <div class="grupo">

                <label for="fechaIngreso">

                    <i class="fa-solid fa-calendar-days"></i>

                    Fecha de Ingreso

                </label>

                <input
                    type="date"
                    id="fechaIngreso">

            </div>


            <!-- GUARDAR -->

            <button
                type="submit"
                class="btnGuardar">

                <i class="fa-solid fa-floppy-disk"></i>

                Guardar Cambios

            </button>

        </form>


        <!-- BOTÓN VOLVER -->

        <div class="botones">

            <button
                type="button"
                class="btnVolver"
                onclick="window.location.href='simpatizantes.html'">

                <i class="fa-solid fa-caret-left"></i>

                Volver a Simpatizantes

            </button>

        </div>

    </div>


    <!-- JAVASCRIPT -->

    <script
        type="module"
        src="js/editar-simpatizante.js">
    </script>

</body>

</html>
