<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        Editar Simpatizante
    </title>

    <!-- FONT AWESOME -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- CSS -->

    <link
        rel="stylesheet"
        href="css/formularios.css">

</head>

<body>

    <div class="contenedor">

        <!-- =====================================
             CABECERA
             ===================================== -->

        <div class="cabecera">

            <h1>
                Editar Simpatizante
            </h1>

            <button
                type="button"
                class="btnVolver"
                onclick="window.location.href='simpatizantes.html'">

                <i class="fa-solid fa-caret-left"></i>

                Volver

            </button>

        </div>


        <!-- =====================================
             FORMULARIO
             ===================================== -->

        <form id="formEditar">


            <!-- NOMBRE -->

            <div class="grupo">

                <label for="nombre">
                    Nombre Completo
                </label>

                <input
                    type="text"
                    id="nombre"
                    placeholder="Nombre Completo"
                    required>

            </div>


            <!-- CELULAR -->

            <div class="grupo">

                <label for="celular">
                    Celular
                </label>

                <input
                    type="number"
                    id="celular"
                    placeholder="Número de celular">

            </div>


            <!-- FECHA DE INGRESO -->

            <div class="grupo">

                <label for="fechaIngreso">
                    Fecha de Ingreso
                </label>

                <input
                    type="date"
                    id="fechaIngreso">

            </div>


            <!-- GUARDAR -->

            <button
                type="submit"
                class="btnGuardar">

                <i class="fa-solid fa-floppy-disk"></i>

                Guardar Cambios

            </button>

        </form>

    </div>


    <!-- JAVASCRIPT -->

    <script
        type="module"
        src="js/editar-simpatizante.js">
    </script>

</body>

</html>
