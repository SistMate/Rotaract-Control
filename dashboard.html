<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rotos´s Control - Menu Principal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="css/dashboard.css">
</head>

<body>

    <header>

        <div>
            <h1>ROTOS´S CONTROL</h1>
            <p id="nombreUsuario">Cargando...</p>
        </div>

        <button id="btnLogout">
            <i class="fa-solid fa-right-from-bracket"></i>
            CERRAR SESIÓN
        </button>

    </header>

    <main>

        <div class="card" onclick="location.href='reunion.html'">
            <i class="fa-solid fa-user-clock"></i>
            <h3>ASISTENCIA REUNIONES</h3>
        </div>

        <div class="card" onclick="location.href='actividad.html'">
            <i class="fa-solid fa-user-check"></i>
            <h3>ASISTENCIA ACTIVIDADES</h3>
        </div>

        <div class="card" onclick="location.href='registrar-pago.html'">
            <i class="fa-solid fa-cash-register"></i>
            <h3>REGISTRAR PAGOS</h3>
        </div>

        <div class="card" onclick="location.href='socios.html'">
            <i class="fa-solid fa-users"></i>
            <h3>SOCIOS</h3>
        </div>

        <div class="card" onclick="location.href='simpatizantes.html'">
            <i class="fa-solid fa-user-friends"></i>
            <h3>SIMPATIZANTES</h3>
        </div>

        <div class="card" onclick="location.href='pagos.html'">
            <i class="fa-solid fa-coins"></i>
            <h3>PAGOS</h3>
        </div>

        <div class="card" onclick="location.href='porcentaje-socios.html'">
            <i class="fa-solid fa-rectangle-list"></i>
            <h3>ASISTENCIA DE SOCIOS</h3>
        </div>

        <div class="card" onclick="location.href='porcentaje-simpatizantes.html'">
            <i class="fa-solid fa-rectangle-list"></i>
            <h3>ASISTENCIA DE SIMPATIZANTES</h3>
        </div>

        <div class="card" onclick="location.href='lista-actividades.html'">
            <i class="fa-solid fa-clipboard-list"></i>
            <h3>LISTA DE ACTIVIDADES</h3>
        </div>

    </main>
            <div class="footer">
                <p>
                    &copy; 2026 Rotaract Club Cochabamba
                </p>
            </div>
    <script type="module" src="js/dashboard.js"></script>
              
</body>
</html>
